<!doctype html>
<!--
  שער לגופן הארוז: האם ה-@font-face שהתוסף מזריק בזמן ריצה נטען בפועל
  מ-file://, ה-origin שממנו אוצריא טוענת תוסף ארוז.

  הדף טוען את ה-build האמיתי (assets/app.js), ולכן הוא בודק את ההצהרה של הקוד
  ולא העתק שלה. main() ממתין ל-plugin.boot שלא יגיע כאן, אבל installBundledFonts()
  רץ לפני ההמתנה.

  הרצה — הקובץ חייב לשבת בתוך dist/, כדי ש-./fonts/ ייפתר כמו בתוסף הארוז:

    npm run build && cp scripts/font-check.html dist/
    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless \
      --virtual-time-budget=15000 --dump-dom "file://$PWD/dist/font-check.html"

  קריאת התוצאה: `verdict` הוא FONTS-OK/FONTS-FAIL, אבל **המספר הקובע הוא
  widthSegoe מול widthSerif**. `document.fonts.check()` מחזיר true גם בלי שום
  @font-face (נמדד), ולכן הוא אינו עדות; רוחב שונה מ-serif הוא כן.
-->
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <title>pending</title>
  </head>
  <body>
    <div id="app"></div>
    <pre id="out">pending</pre>
    <script src="./assets/engine-workers.js"></script>
    <script src="./assets/app.js"></script>
    <script>
      (async function () {
        var out = document.getElementById('out');
        function report(o) {
          out.textContent = JSON.stringify(o, null, 1);
          document.title = o.verdict;
        }

        for (var i = 0; i < 200 && !document.getElementById('bundled-fonts'); i++) {
          await new Promise(function (r) {
            setTimeout(r, 25);
          });
        }
        var injected = !!document.getElementById('bundled-fonts');
        if (!injected) return report({ verdict: 'NO-STYLE', injected: false });

        var specs = [
          ['400 16px "Segoe UI"', 'אבג ABC'],
          ['600 16px "Segoe UI"', 'אבג ABC'],
          ['700 16px "Segoe UI"', 'אבג ABC'],
          ['italic 400 16px "Segoe UI"', 'ABC'],
        ];
        var results = [];
        for (var s = 0; s < specs.length; s++) {
          try {
            var faces = await document.fonts.load(specs[s][0], specs[s][1]);
            results.push({
              spec: specs[s][0],
              loaded: faces.length,
              check: document.fonts.check(specs[s][0]),
            });
          } catch (e) {
            results.push({ spec: specs[s][0], error: String(e) });
          }
        }

        function width(family) {
          var c = document.createElement('canvas').getContext('2d');
          c.font = '40px ' + family;
          return c.measureText('אבגדה Wgm').width;
        }

        var loadedAll = results.every(function (r) {
          return r.loaded === 1;
        });
        var distinct = width('"Segoe UI", serif') !== width('serif');
        report({
          verdict: loadedAll && distinct ? 'FONTS-OK' : 'FONTS-FAIL',
          origin: location.protocol,
          injected: injected,
          results: results,
          widthSegoe: width('"Segoe UI", serif'),
          widthSerif: width('serif'),
          fontsSize: document.fonts.size,
        });
      })();
    </script>
  </body>
</html>
