# אימות התוסף מול הולידטור הרשמי של אוצריא, בכל PR.
#
# למה בנפרד מ-release.yml: זה רץ על `push` ל-main בלבד, כלומר אחרי
# שהשינוי כבר נכנס. שער ההתקנה של אוצריא ושל החנות מופעל בדיוק על
# מה ש-PR משנה — מניפסט, הרשאות, הפניות לנכסים — ולכן המקום לבדוק הוא כאן.
#
# הוולידטור מושך את `spec.json` החי מ-Otzaria/otzaria@dev — ארטיפקט שמיוצר מקוד
# ה-Dart של האפליקציה — ולכן API או הרשאה שאוצריא שינתה מורגשת כאן בלי לעדכן דבר.
# נפילת האחזור אינה מכשילה: ה-action נופל לעותק המצורף בו, שהוא אותו ארטיפקט.
name: Validate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  # להערת הסיכום על ה-PR. ב-PR מ-fork הטוקן לקריאה בלבד והפרסום מדולג
  # באזהרה — הבדיקה עצמה רצה בכל מקרה, והתוצאה נכתבת ל-job summary.
  pull-requests: write

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: אימות התוסף
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # מ-.nvmrc, כדי ש-CI והמפתחים ירוצו על אותה גרסה. ה-webstorage של
          # Node 22+ מטופל בסביבת הבדיקות ואינו הסיבה לנעילה כאן.
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # `npm test` חוסם ב-release.yml, כלומר רק אחרי שהשינוי כבר ב-main.
      # בלעדיו כאן, PR ששובר את חבילת הטסטים עובר ירוק ומפיל את ה-Release.
      - name: Test
        run: npm test

      # הוולידטור בודק את מה שנארז בפועל, ולכן הוא דורש בנייה: מניפסט
      # תקין ב-public לא מוכיח שהנכסים שה-HTML מפנה אליהם נמצאים בארכיון.
      - name: Build (Vite -> dist)
        run: npm run build

      - name: Check dist
        run: npm run check:dist

      # `fail-on-warnings: true` משקף את החנות, שחוסמת גם על אזהרות. dist עובר
      # ב-0 אזהרות, ולכן זה שער אמיתי ולא רעש.
      #
      # `GITHUB_STEP_SUMMARY` מוסט לקובץ שלנו: הוולידטור כותב אליו את טבלת
      # התוצאות (append פשוט לקובץ שהמשתנה מצביע עליו — נבדק במקור ה-action,
      # src/githubActions.js), וכך הטבלה נתפסת גם כ-artifact בשביל
      # validate-comment.yml — ה-workflow שמפרסם אותה כתגובה על ה-PR. בלעדיו
      # PR מ-fork נשאר בלי תגובה: הטוקן של pull_request מ-fork הוא לקריאה
      # בלבד (מגבלת GitHub), וה-action מדלג על הפרסום באזהרה. הצעד שאחרי
      # מחזיר את הטבלה לסיכום האמיתי של ה-job, כך שדבר אינו הולך לאיבוד.
      #
      # `pr-comment: 'true'` נשאר: ב-PR מאותו מאגר ה-action עדיין מפרסם
      # ישירות — מהר יותר, ו-validate-comment.yml רק מחליף בתוכן זהה.
      - name: Validate dist against the live SDK spec
        uses: Otzaria/otzaria-plugin-validator@v1
        env:
          GITHUB_STEP_SUMMARY: ${{ runner.temp }}/validator-summary.md
        with:
          path: dist
          publish: 'false'
          fail-on-warnings: 'true'
          pr-comment: 'true'
          github-token: ${{ github.token }}

      # `always()`: דווקא ריצה שנכשלה היא זו שהטבלה שלה חשובה על ה-PR.
      - name: Restore the validator summary to the job summary
        if: ${{ always() }}
        run: |
          if [ -f "${{ runner.temp }}/validator-summary.md" ]; then
            cat "${{ runner.temp }}/validator-summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Hand the summary to the PR-comment workflow
        if: ${{ always() && github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v4
        with:
          name: validator-summary
          path: ${{ runner.temp }}/validator-summary.md
          if-no-files-found: ignore
          retention-days: 3
